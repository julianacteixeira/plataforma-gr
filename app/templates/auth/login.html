{% extends "base.html" %}
{% block content %}
<h1>Login — Plataforma de Guest Relations</h1>
<form method="POST">
  {{ form.hidden_tag() }}
  <p>
    {{ form.email.label }}<br>
    {{ form.email(size=32) }}
  </p>
  <p>
    {{ form.password.label }}<br>
    {{ form.password(size=32) }}
  </p>
  {{ form.submit() }}
</form>
{% endblock %}
